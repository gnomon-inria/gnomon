image: conda/miniconda3

stages:
  - build
  - deploy

.template_retry:
  retry:
    max: 2
    when: runner_system_failure

conda_build_linux:
  stage: build
  script:
  - apt update
  - apt install libgl1 libgl1-mesa-dev mesa-common-dev freeglut3-dev -y
  - conda update -n base -c defaults conda
  - conda install python=3.7 conda-build git anaconda-client conda-verify
  - mkdir conda-bld
  - conda build . -c dtk-forge -c conda-forge --output-folder conda-bld/
  extends: .template_retry
  artifacts:
    paths:
      - conda-bld
  only:
  - master
  - develop
  - merge_requests

anaconda_linux_master:
  stage: deploy
  script:
  - conda update -n base -c defaults conda
  - conda install conda-build anaconda-client
  - anaconda --token=$ANACONDA_TOKEN upload conda-bld/linux-64/gnomon-* --force --user gnomon
  extends: .template_retry
  only:
  - master


anaconda_linux_develop :
  stage: deploy
  script:
  - conda update -n base -c defaults conda
  - conda install conda-build anaconda-client curl
  - curl -X POST https://ci.inria.fr/gnomon/job/gnomon-conda-mac-develop/build?token=$JENKINS_TOKEN
  - anaconda --token=$ANACONDA_TOKEN upload conda-bld/linux-64/gnomon-* --force --user gnomon
  extends: .template_retry
  when: manual
  only: 
  - develop


pages:
  stage: deploy
  script:
  - cd doc
  - conda update -n base -c defaults conda
  - conda install sphinx make matplotlib
  - conda install -c conda-forge doxygen breathe
  - make html
  - mv build/html ../public
  extends: .template_retry
  artifacts:
    paths:
    - public
  only:
  - master
  - develop
