image: conda/miniconda3

stages:
  - test
  - pages
  - condabuild
  - deploy


.template_retry:
  retry:
    max: 2
    when: runner_system_failure


test_linux:
  stage: test
  tags: 
    - linux
    - large
  script:
    - . "/builds/miniconda3/etc/profile.d/conda.sh"
    - mamba env update -f conda/env_linux.yaml
    - conda activate gnomon-dev
    - rm -rf build
    - mkdir build
    - cd build
    - cmake ..
    - make -j3
    - CTEST_OUTPUT_ON_FAILURE=1 make test
  extends: .template_retry
  only:
    - merge_requests

test_macos:
  stage: test
  tags: 
    - macos
    - large
  script:
    - source /Users/ci/miniconda3/etc/profile.d/conda.sh
    - mamba env update -f conda/env_macos.yaml
    - conda activate gnomon-dev
    - rm -rf build
    - mkdir build
    - cd build
    - cmake ..
    - make -j2
    - ctest -T test --timeout 120 --no-compress-output --output-on-failure
  extends: .template_retry
  only:
    - merge_requests


conda_build_linux:
  stage: condabuild
  tags: 
    - linux
    - large
  script:
    - . "/builds/miniconda3/etc/profile.d/conda.sh"
    - mkdir conda-bld
    - mamba mambabuild conda -c dtk-forge6 -c conda-forge --output-folder conda-bld/
  extends: .template_retry
  artifacts:
    paths:
      - conda-bld
  only:
    - master

conda_build_macos:
  stage: condabuild
  tags: 
    - macos
    - large
  script:
    - source /Users/ci/miniconda3/etc/profile.d/conda.sh
    - conda activate base
    - mkdir conda-bld
    - mamba mambabuild conda -c dtk-forge6 -c conda-forge --output-folder conda-bld/
  extends: .template_retry
  artifacts:
    paths:
      - conda-bld
  only:
    - master


conda_build_linux_develop:
  stage: condabuild
  tags: 
    - linux
    - large
  script:
    - . "/builds/miniconda3/etc/profile.d/conda.sh"  
    - mkdir conda-bld
    - mamba mambabuild conda -c dtk-forge6 -c conda-forge --output-folder conda-bld/
  extends: .template_retry
  when: manual
  artifacts:
    paths:
      - conda-bld
  only:
    - develop


anaconda_linux_master:
  stage: deploy
  tags: 
    - linux
    - large
  needs: [conda_build_linux]
  script:
    - . "/builds/miniconda3/etc/profile.d/conda.sh"  
    - mamba install -c conda-forge anaconda-client
    - anaconda --token=$ANACONDA_TOKEN upload conda-bld/linux-64/libgnomon-* --force --user gnomon
  extends: .template_retry
  only:
    - master

anaconda_macos_master:
  stage: deploy
  tags: 
    - macos
    - large
  needs: [conda_build_macos]
  script:
    - source /Users/ci/miniconda3/etc/profile.d/conda.sh
    - conda activate base
    - mamba install -c conda-forge anaconda-client
    - anaconda --token=$ANACONDA_TOKEN upload conda-bld/macos-64/libgnomon-* --force --user gnomon
  extends: .template_retry
  only:
    - master

anaconda_linux_develop :
  stage: deploy
  tags: 
    - linux
    - large
  script:
  - conda install -n base -c defaults conda python=3.9 -y
  - conda install conda-build anaconda-client curl
  #- curl -X POST https://ci.inria.fr/gnomon/job/gnomon-conda-mac-develop/build?token=$JENKINS_TOKEN
  - anaconda --token=$ANACONDA_TOKEN upload conda-bld/linux-64/libgnomon-* --force --user gnomon
  extends: .template_retry
  when: manual
  only:
    - develop


deploy_pages:
  stage: pages
  tags:
    - linux
  script:
    - . "/builds/miniconda3/etc/profile.d/conda.sh"  
    - mamba install -c conda-forge sphinx make matplotlib-base myst-parser doxygen breathe=4.32
    - cd doc
    - make html
    - mv build/html ../public
    - cd ../doc_md
    - make html
    - mkdir -p ../public/staging
    - cp -R _build/html/* ../public/staging
  extends: .template_retry
  artifacts:
    paths:
      - public
  only:
    - master
    - develop
