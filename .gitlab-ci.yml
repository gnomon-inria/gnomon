image: conda/miniconda3

stages:
  - build
  - deploy

.template_retry:
  retry:
    max: 2
    when: runner_system_failure

conda_build_linux:
  stage: build
  script:
  - apt update
  - apt install libgl1 -y
  - conda update -n base -c defaults conda
  - conda install conda-build git anaconda-client conda-verify
  - mkdir conda-bld
  - conda build . -c dtk-forge -c conda-forge --output-folder conda-bld/
  extends: .template_retry
  artifacts:
    paths:
      - conda-bld
  rules:
    - if: $CI_COMMIT_BRANCH == 'master'  
    - if: $CI_COMMIT_BRANCH == 'develop'  
    - if: $CI_MERGE_REQUEST_ID  

anaconda_linux_master:
  stage: deploy
  script:
  - conda update -n base -c defaults conda
  - conda install conda-build anaconda-client
  - anaconda --token=$ANACONDA_TOKEN upload conda-bld/linux-64/gnomon-* --force --user gnomon
  extends: .template_retry
  rules:
    - if: $CI_COMMIT_BRANCH == 'master'  


anaconda_linux_develop :
  stage: deploy
  script:
  - conda update -n base -c defaults conda
  - conda install conda-build anaconda-client
  - anaconda --token=$ANACONDA_TOKEN upload conda-bld/linux-64/gnomon-* --force --user gnomon
  extends: .template_retry
  when: manual
  only: 
  - develop


pages:
  stage: deploy
  script:
  - cd doc
  - conda update -n base -c defaults conda
  - conda install sphinx make matplotlib
  - conda install -c conda-forge doxygen breathe
  - make html
  - mv build/html ../public
  extends: .template_retry
  artifacts:
    paths:
    - public
  rules:
    - if: $CI_COMMIT_BRANCH == 'master'  
    - if: $CI_COMMIT_BRANCH == 'develop'  
