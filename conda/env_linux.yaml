    - pymongo
    - matplotlib-base
    - timagetk =3
    - python-lsp-server
    - gcc_linux-64 = 11.2.0
    - gxx_linux-64 = 11.2.0
    - libgcc-ng =11.2.0
    - libstdcxx-ng =11.2.0
    - libglvnd-devel-cos7-x86_64
    - xorg-x11-proto-devel-cos7-x86_64
    - mesa-libgl-devel-cos7-x86_64
    - mesa-libegl-devel-cos7-x86_64
