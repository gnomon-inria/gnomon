  - conda-forge
  - default
dependencies:
  - python=3.7
  - cmake
  - ipython
  - qtconsole
  - pillow
  - numpy
  - scipy
  - matplotlib
  - dtk-log >=2.0.0
  - dtk-macs >=2.0.3
