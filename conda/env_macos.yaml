name: gnomon-dev

channels:
  - dtk-forge6
  - conda-forge
  - mosaic
  - morpheme
  - gnomon
dependencies:
    - cmake
    - qt >=6.2
    - git
    - rust
    - vtk =9.1.0
    - dtk-core
    - dtk-script >= 2.5.1
    - dtk-core-python
    - dtk-imaging
    - dtk-imaging-python
    - dtk-plugins-imaging
    - python =3.9
    - ipython
    - numpy
    - scipy != 1.8.1
    - swig >=4.1
    - pymongo
    - jinja2
    - matplotlib-base
    - timagetk =3
    - python-lsp-server
    - pyside6
    - qtconsole-base
    - pip
    - pip:
        - morphonet
