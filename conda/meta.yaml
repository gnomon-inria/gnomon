package:
  name: gnomon
  version: {{ environ.get('GIT_DESCRIBE_TAG', 'default') }}

source:
  #git_url: git@gitlab.inria.fr:gnomon/gnomon.git
  #git_tag: develop
  path: ../

build:
  number: {{ GIT_DESCRIBE_NUMBER }}

requirements:
  build:
    - cmake
    - make
    - {{ compiler('cxx') }}              # [linux]
    - {{ cdt('xorg-x11-proto-devel') }}  # [linux]
    - {{ cdt('mesa-libgl-devel') }}      # [linux]
    - {{ cdt('mesa-libegl-devel') }}     # [linux]
    - {{ cdt('mesa-dri-drivers') }}      # [linux]
    - {{ cdt('libx11-devel') }}          # [linux]
    - {{ cdt('libXt-devel') }}           # [linux]
    - {{ cdt('libSM-devel') }}           # [linux]
    - {{ cdt('libxext-devel') }}         # [linux]
    - {{ cdt('libuuid-devel') }}         # [linux]
    - {{ cdt('libICE-devel') }}          # [linux]
    - {{ cdt('libxcb') }}                # [linux]
    - {{ cdt('libxrender-devel') }}      # [linux]
    - {{ cdt('libxau-devel') }}          # [linux]
    - {{ cdt('libdrm-devel') }}          # [linux]
    - {{ cdt('libxcomposite-devel') }}   # [linux]
    - {{ cdt('libxcursor-devel') }}      # [linux]
    - {{ cdt('libxi-devel') }}           # [linux]
    - {{ cdt('libxrandr-devel') }}       # [linux]
    - {{ cdt('pciutils-devel') }}        # [linux]
    - {{ cdt('libxscrnsaver-devel') }}   # [linux]
    - {{ cdt('libxtst-devel') }}         # [linux]
    - {{ cdt('libselinux-devel') }}      # [linux]
    - {{ cdt('libxdamage') }}            # [linux]
    - {{ cdt('libxdamage-devel') }}      # [linux]
    - {{ cdt('libxfixes') }}             # [linux]
    - {{ cdt('libxfixes-devel') }}       # [linux]
    - {{ cdt('libxxf86vm') }}            # [linux]

  host:
    - qt =5.15.2
    - dtk-log =2.5.0
    - dtk-core =2.11.0
    - dtk-core-python =2.8.0
    - dtk-imaging =2.0.4
    - dtk-imaging-python =2.0.6
    - dtk-script =2.5.1
    - python =3.7
    - swig =4.0
    - vtk=8.2.0
    - ffmpeg=4.1
    - libnetcdf =4.8
    - tbb-devel =2021.3
    - zlib=1.2.11

  run:
    - qt =5.15.2
    - dtk-log =2.5.0
    - dtk-core =2.11.0
    - dtk-core-python =2.8.0
    - dtk-imaging =2.0.4
    - dtk-imaging-python =2.0.6
    - dtk-script =2.5.1
    - jupyter
    - jupyter_client=5.3.4
    - pillow
    - numpy
    - matplotlib
    - mongodb =4.0
    - pymongo =3.11
    - python >=3.7
    - sip
    - vtk=8.2.0
    - ffmpeg=4.1
    - libnetcdf =4.8
    - tbb-devel =2021.3
    - zlib=1.2.11

app:
  entry: gnomon # [linux]
  entry: open ${PREFIX}/bin/gnomon # [osx]
  summary: Gnomon is a computational platform to analyse and simulate the development of life forms in 3D
  icon: gnomon_logo.png
  type: desk

about:
  home: https://gnomon.gitlabpages.inria.fr/gnomon
  license: CECILL-C
  summary:  Gnomon is a computational platform to analyse and simulate the development of life forms in 3D
