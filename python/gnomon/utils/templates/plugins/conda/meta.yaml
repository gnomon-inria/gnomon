package:
  name: plugin_{{package_name}}
{% raw %}
  version: {{ environ.get('GIT_DESCRIBE_TAG', 'default') }}

source:
  path: ../

build:
  number: {{ GIT_DESCRIBE_NUMBER }}
  preserve_egg_dir: True
{% endraw %}

requirements:
  build:
    - setuptools
    - python=${PYTHON_VERSION}.*
    - gnomon=${gnomon_VERSION}
    - dtk-plugins-imaging >=2.0.2
  host:
    - python=${PYTHON_VERSION}.*
    - gnomon=${gnomon_VERSION}
    - dtk-plugins-imaging >=2.0.2
  run: 
    - python=${PYTHON_VERSION}.*
    - gnomon=${gnomon_VERSION}
    - ipython
    - dtk-plugins-imaging>=2.0.2
    - nose
    - coverage

about:
  home: {{url}}
  license: {{license}}
  summary: {{short_descr}}
